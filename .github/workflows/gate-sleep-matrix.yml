# Phase-3 gate scaffolding: synthetic sleep-job matrix for kill-testing
# (implementation-phases.md Task 12). Manually dispatched only; remove after
# the gate.
name: gate-sleep-matrix
# Trigger: push a change to .github/gate-trigger whose first line is
# "<jobs> <sleep-seconds>" (PAT lacks workflow_dispatch permission).
on:
  push:
    branches: [phase-3-fleet-lifecycle]
    paths: [".github/gate-trigger"]
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.gen.outputs.ids }}
      sleep: ${{ steps.gen.outputs.sleep }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          read -r n sleep < .github/gate-trigger
          ids=$(seq 1 "$n" | jq -cs .)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "sleep=$sleep" >> "$GITHUB_OUTPUT"
  burst:
    needs: plan
    strategy:
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    runs-on: [self-hosted, burst]
    steps:
      - run: sleep ${{ needs.plan.outputs.sleep }}
