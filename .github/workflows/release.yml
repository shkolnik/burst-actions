name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild, attest, and (re)upload"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - run: cargo build --release --locked
      - run: cp target/release/burst burst-linux-x86_64
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: burst-linux-x86_64
      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "burst $TAG" --generate-notes
          gh release upload "$TAG" burst-linux-x86_64 --clobber
