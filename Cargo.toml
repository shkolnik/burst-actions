[package]
name = "burst"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "On-demand ephemeral cloud VMs as GitHub Actions self-hosted runners"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1", features = ["rt"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1"
aws-sdk-scheduler = "1"
aws-sdk-iam = "1"
aws-sdk-budgets = "1"
aws-sdk-sts = "1"
aws-smithy-types = "1"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Closed sets are matched exhaustively — a `_ =>` arm on our own enums is the
# stale-branch bug the compiler exists to catch (CLAUDE.md engineering philosophy).
wildcard_enum_match_arm = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
